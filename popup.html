<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
    }

    h1 {
      font-size: 16px;
      text-align: center;
      margin-bottom: 16px;
      color: #00d2ff;
      letter-spacing: 0.5px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: #00d2ff;
    }

    textarea {
      resize: vertical;
      min-height: 56px;
      font-family: inherit;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .toggle-row span {
      font-size: 13px;
      font-weight: 600;
    }

    .switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      margin: 0;
      padding: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch input:checked + .slider {
      background: #00d2ff;
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #00d2ff;
      color: #1a1a2e;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #00b8e6;
    }

    .status {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      color: #4caf50;
      min-height: 16px;
    }

    .hint {
      font-size: 11px;
      color: #666;
      margin-top: -8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>Keyword Monitor</h1>

  <label for="targetUrl">Target URL</label>
  <input type="text" id="targetUrl" placeholder="https://example.com/page" />
  <p class="hint">Matches any tab whose URL contains this value.</p>

  <label for="keywords">Keywords</label>
  <textarea id="keywords" placeholder="keyword1, keyword2, keyword3"></textarea>
  <p class="hint">Comma-separated. Case-insensitive.</p>

  <div class="toggle-row">
    <span>Monitoring</span>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <button id="save">Save &amp; Apply</button>
  <p class="status" id="status"></p>

  <script src="popup.js"></script>
</body>
</html>
